services:
  # Bundled Ollama — started only when you pass --profile ollama
  # (setup.py does this automatically when no host Ollama is detected).
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    profiles: ["ollama"]
    environment:
      - OLLAMA_KEEP_ALIVE=24h
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped
    # Uncomment for NVIDIA GPU acceleration:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  signal-api:
    image: bbernhard/signal-cli-rest-api:0.98
    container_name: signal-api
    environment:
      - MODE=normal
    ports:
      - "18080:8080"
    volumes:
      - signal-cli-data:/home/.local/share/signal-cli
    restart: unless-stopped

  ollama-signal-bot:
    build: .
    container_name: ollama-signal-bot
    environment:
      - SIGNAL_API_URL=http://signal-api:8080
    env_file:
      - .env
    # Lets http://host.docker.internal:11434 reach a host-installed Ollama
    # on Linux too (not just Docker Desktop).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - signal-api
    restart: unless-stopped

volumes:
  signal-cli-data:
  ollama-data:
